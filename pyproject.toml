[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "ad-org-sync"
version = "3.0.0"
description = "Single-organization DingTalk synchronization and LDAPS self-service password reset."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["Django==5.2.17", "ldap3==2.9.1", "requests>=2.32.4,<3", "waitress>=3.0.2,<4", "whitenoise>=6.9,<7", "filelock>=3.18,<4"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-django>=4.11,<5", "ruff>=0.15,<1", "mypy>=1.19,<3", "playwright>=1.52,<2", "PyYAML>=6,<7", "build>=1.2,<2", "cyclonedx-bom>=7,<8"]
[project.scripts]
ad-org-sync = "sync_app.cli:main"
[tool.setuptools.packages.find]
include = ["sync_app*"]
[tool.setuptools.package-data]
sync_app = ["templates/*.html", "templates/registration/*.html", "static/*"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "sync_app.settings"
testpaths = ["tests"]
[tool.ruff]
target-version = "py310"
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
