[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"
[project]
name = "ad-org-sync"
version = "3.0.0"
description = "Single-organization DingTalk synchronization and LDAPS self-service password reset."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["Django==5.2.17", "ldap3==2.9.1", "requests==2.34.2", "waitress==3.0.2", "whitenoise==6.12.0", "filelock==3.32.7"]
[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-django==4.14.0", "ruff==0.16.9", "mypy==2.3.1", "playwright==1.63.0", "PyYAML==6.0.3", "build==1.6.1", "cyclonedx-bom==7.4.0"]
[dependency-groups]
build = ["pip==26.2.1", "setuptools==84.0.0", "wheel==0.48.0"]
[project.scripts]
ad-org-sync = "sync_app.cli:main"
[tool.setuptools.packages.find]
include = ["sync_app*"]
[tool.setuptools.package-data]
sync_app = ["templates/*.html", "templates/registration/*.html", "templates/admin/*.html", "static/*"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "sync_app.settings"
testpaths = ["tests"]
[tool.ruff]
target-version = "py310"
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
