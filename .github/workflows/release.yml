name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
env:
  PIP_NO_CACHE_DIR: "1"
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints.txt
  PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/constraints.txt
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install locked development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip check
      - run: python -m pytest -q --ignore=tests/test_browser.py
      - run: python -m build --wheel --outdir dist/packages
      - uses: actions/upload-artifact@v7
        with:
          name: ad-org-sync-release
          path: |
            dist/packages/*.whl
            constraints.txt
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/packages/*.whl
            constraints.txt
