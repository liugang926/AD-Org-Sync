                  contents = ad.search("(objectClass=*)", base=move_ou)
                  assert len(contents) == 1 and contents[0]["dn"].casefold() == move_ou.casefold()
                  assert ad.conn.delete(move_ou), "disposable move OU cleanup failed"
              assert ad.ou_identity(move_ou) is None
          assert not Binding.objects.filter(username=username).exists()
          config = Configuration.objects.get(pk=1)
          assert not config.schedule_enabled and not config.sspr_enabled
          print("disposable_account_absent_and_production_binding_unchanged=true")
          PY
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1/readyz >/dev/null
          echo 'localhost_readyz=200'
