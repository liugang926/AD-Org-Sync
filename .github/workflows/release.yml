name: Stop legacy service (one-time operator task)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stop-legacy:
    runs-on: [self-hosted, linux, x64, production]
    environment: production
    timeout-minutes: 10
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Back up and stop only the verified legacy Compose project
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t web_ids < <(docker ps -q --filter label=com.docker.compose.project=ad_org_sync --filter label=com.docker.compose.service=web)
          if [[ ${#web_ids[@]} == 0 ]]; then
            echo 'No running web service; no containers changed.'
            exit 0
          fi
          [[ ${#web_ids[@]} == 1 ]] || { echo 'Ambiguous web container'; exit 1; }
          web="${web_ids[0]}"
          version="$(docker exec "$web" python -c 'import importlib.metadata; print(importlib.metadata.version("ad-org-sync"))')"
          [[ "$version" == 2.* ]] || { echo "Refusing to stop non-legacy version: $version"; exit 1; }
          echo "Verified legacy application version: $version"
          docker exec "$web" python -m sync_app.cli db-backup --db-path /data/app.db --label pre-legacy-shutdown --json
          mapfile -t ids < <(docker ps -aq --filter label=com.docker.compose.project=ad_org_sync)
          for id in "${ids[@]}"; do
            service="$(docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' "$id")"
            case "$service" in
              web|nginx|worker)
                docker update --restart=no "$id" >/dev/null
                docker stop --time 30 "$id"
                ;;
            esac
          done
          if docker ps --filter label=com.docker.compose.project=ad_org_sync --format '{{.Label "com.docker.compose.service"}}' | grep -Eq '^(web|nginx|worker)$'; then
            echo 'Legacy service still running'; exit 1
          fi
          docker ps -a --filter label=com.docker.compose.project=ad_org_sync --format '{{.Names}}|{{.Image}}|{{.Status}}'
          echo 'Legacy containers stopped with restart disabled. Volumes and backups preserved.'
