name: Production acceptance diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staged-create-drill:
    if: ${{ false }}
    runs-on: [self-hosted, linux, x64, production]
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Exercise disabled-create update and enable in dedicated test AD OU
        shell: bash
        run: |
          set -Eeuo pipefail
          expected=a480636d3dc40e4a9e98ef859831320b50ed7140
          test "$(tr -d '\r\n' < /opt/ad-org-sync/shared/last_successful_image_tag)" = "$expected"
          test "$(docker inspect --format '{{.Config.Image}}' ad_org_sync-web-1)" = "ad-org-sync-web:$expected"
          docker exec -i -e TEST_RUN_ID="$GITHUB_RUN_ID" ad_org_sync-web-1 python - < .github/diagnostics/staged_create_drill.py
      - name: Check production readiness after drill
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1/readyz >/dev/null
          echo 'localhost_readyz=200'
  source-scope-readonly:
    if: ${{ false }}
    runs-on: [self-hosted, linux, x64, production]
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: afd5de084e5f3b46d2f17ae12063c6d4561bfba0
          persist-credentials: false
      - name: Verify source-scope method against live DingTalk without writes
        shell: bash
        run: |
          set -Eeuo pipefail
          expected=a480636d3dc40e4a9e98ef859831320b50ed7140
          test "$(tr -d '\r\n' < /opt/ad-org-sync/shared/last_successful_image_tag)" = "$expected"
          test "$(docker inspect --format '{{.Config.Image}}' ad_org_sync-web-1)" = "ad-org-sync-web:$expected"
          method_source="$(base64 -w0 sync_app/directory.py)"
          docker exec -i -e SCOPE_METHOD_SOURCE_B64="$method_source" ad_org_sync-web-1 python - <<'PY'
          import ast
          import base64
          import os
          from contextlib import closing

          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "sync_app.settings")
          import django
          django.setup()
          from sync_app.directory import DingTalk
          from sync_app.domain import RuleError
          from sync_app.models import Configuration

          source_text = base64.b64decode(os.environ["SCOPE_METHOD_SOURCE_B64"]).decode()
          source_tree = ast.parse(source_text)
          source_class = next(node for node in source_tree.body if isinstance(node, ast.ClassDef) and node.name == "DingTalk")
          method = next(node for node in source_class.body if isinstance(node, ast.FunctionDef) and node.name == "user_in_scope")
          namespace = {"RuleError": RuleError}
          exec(compile(ast.Module(body=[method], type_ignores=[]), "pr65-source-scope", "exec"), namespace)
          DingTalk.user_in_scope = namespace["user_in_scope"]

          config = Configuration.objects.get(pk=1)
          assert not config.schedule_enabled and not config.sspr_enabled
          with closing(DingTalk()) as source:
              users, departments = source.collect(config.root_department)
              candidates = [user for user in users if user["employee_id"] == "T0001919"]
              assert len(candidates) == 1
              person = source.user(candidates[0]["source_id"])
              assert person["employee_id"] == "T0001919"
              assert source.user_in_scope(person, config.root_department)
          print("live_source_scope_verified=true")
          print("source_user_count=" + str(len(users)))
          print("source_department_count=" + str(len(departments)))
          print("production_sspr_and_schedule_still_disabled=true")
          PY
  conflict-summary-61:
    if: ${{ false }}
    runs-on: [self-hosted, linux, x64, production]
    environment: production
    timeout-minutes: 3
    steps:
      - name: Count conflict categories from the latest live preview without personal data
        shell: bash
        run: |
          set -Eeuo pipefail
          expected=a480636d3dc40e4a9e98ef859831320b50ed7140
          test "$(tr -d '\r\n' < /opt/ad-org-sync/shared/last_successful_image_tag)" = "$expected"
          docker exec -i ad_org_sync-web-1 python - <<'PY'
          import os
          from collections import Counter
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "sync_app.settings")
          import django
          django.setup()
          from sync_app.models import Job

          job = Job.objects.get(pk="e28946c1-50c1-4c2d-85f3-89c9d3a8fecc")
          assert job.kind == "preview" and job.status == "blocked" and job.scope == "full"
          categories = {
              "主部门不明确，请在人员页面指定": "main_department_ambiguous",
              "新账号命名为空、重复、被占用或受保护": "account_name_collision",
              "匹配字段缺失或重复": "match_field_missing_or_duplicate",
              "工号缺失或重复": "job_number_missing_or_duplicate",
              "工号重复，不能创建账号": "job_number_duplicate_on_create",
              "多个 AD 账号命中同一标识": "multiple_ad_matches",
              "AD 账号已占用、受保护或已禁用": "ad_account_occupied_or_protected",
              "工号已存在于其他 AD 账号，请人工核验": "job_number_used_by_other_ad_account",
              "目标受保护或已禁用，需人工处理": "bound_target_protected_or_disabled",
              "绑定目标不存在或无法唯一确认": "bound_target_missing",
          }
          conflicts = [item for item in job.plan["operations"] if item["action"] == "conflict"]
          counts = Counter(categories.get(item["reason"], "other") for item in conflicts)
          print("person_conflicts=" + str(len(conflicts)))
          for category, count in sorted(counts.items()):
              print("conflict_" + category + "=" + str(count))
          departments = [item for item in job.plan["departments"] if item["action"] == "conflict"]
          print("department_conflicts=" + str(len(departments)))
          assert len(conflicts) == 19
          PY
  pilot-identity-preflight:
    if: ${{ false }}
    runs-on: [self-hosted, linux, x64, production]
    environment: production
    timeout-minutes: 6
    steps:
      - name: Resolve one dedicated employee and matching AD account read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          expected=a480636d3dc40e4a9e98ef859831320b50ed7140
          test "$(tr -d '\r\n' < /opt/ad-org-sync/shared/last_successful_image_tag)" = "$expected"
          test "$(docker inspect --format '{{.Config.Image}}' ad_org_sync-web-1)" = "ad-org-sync-web:$expected"
          docker exec -i ad_org_sync-web-1 python - <<'PY'
          import hashlib
          import os
          from contextlib import closing
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "sync_app.settings")
          import django
          django.setup()
          from sync_app.directory import ActiveDirectory, DingTalk
          from sync_app.domain import protected
          from sync_app.models import Binding, Configuration

          job_number = "T0001919"
          expected_user_id = "17757325700496563"
          config = Configuration.current()
          assert not config.schedule_enabled and not config.sspr_enabled
          print("sspr_enabled=false schedule_enabled=false")
          print("sspr_match_field=" + config.sspr_match)
          with closing(DingTalk()) as source, closing(ActiveDirectory()) as ad:
              person = source.user(expected_user_id)
              assert person["source_id"] == expected_user_id
              assert person["employee_id"] == job_number
              print("pilot_allowlist_userid_confirmed=true")
              print("dingtalk_userid_fingerprint=" + hashlib.sha256(person["source_id"].encode()).hexdigest()[:12])
              print("local_binding_exists=" + str(Binding.objects.filter(person__source_id=person["source_id"]).exists()).lower())
              assert not Binding.objects.filter(person__source_id=person["source_id"]).exists()
              value = person.get(config.sspr_match, "")
              assert value
              accounts = ad.match(config.sspr_match, value)
              print("ad_match_count=" + str(len(accounts)))
              assert len(accounts) == 1
              eligible = accounts[0]["enabled"] and not protected(accounts[0])
              print("ad_eligible=" + str(eligible).lower())
              assert eligible
          PY
  full-preview-61:
    if: ${{ false }}
    runs-on: [self-hosted, linux, x64, production]
    environment: production
    timeout-minutes: 7
    steps:
      - name: Preview the live DingTalk directory against test AD without writes
        shell: bash
        run: |
          set -Eeuo pipefail
          expected=a480636d3dc40e4a9e98ef859831320b50ed7140
          test "$(tr -d '\r\n' < /opt/ad-org-sync/shared/last_successful_image_tag)" = "$expected"
          test "$(docker inspect --format '{{.Config.Image}}' ad_org_sync-web-1)" = "ad-org-sync-web:$expected"
          docker exec -i ad_org_sync-web-1 python - <<'PY'
          import os
          import time
          from collections import Counter
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "sync_app.settings")
          import django
          django.setup()
          from sync_app.models import Binding, Configuration, Job, Operation, Snapshot
          from sync_app.synchronization import enqueue

          config = Configuration.current()
          assert config.root_ou.casefold() == "OU=ADOrgSync-SyncTest-8fa5fcdf,DC=tianjitest,DC=com".casefold()
          assert not config.schedule_enabled and not config.sspr_enabled
          assert not Job.objects.filter(status__in=["queued", "running"]).exists()
          bindings_before = Binding.objects.count()
          operations_before = Operation.objects.count()
          job = enqueue(kind="preview", scope="full", actor="acceptance-61")
          print("preview_job_id=" + str(job.pk), flush=True)
          for _ in range(210):
              job.refresh_from_db()
              if job.status not in {"queued", "running"}:
                  break
              time.sleep(2)
          else:
              raise SystemExit("preview did not finish within seven minutes")
          print("preview_status=" + job.status)
          print("preview_duration_seconds=" + str(round((job.finished_at - job.started_at).total_seconds(), 1)) if job.finished_at and job.started_at else "preview_duration_seconds=unknown")
          assert job.kind == "preview"
          assert job.status in {"preview_ready", "blocked", "needs_confirmation"}, job.message
          snapshot = Snapshot.objects.get(pk=job.plan["snapshot"])
          assert snapshot.users and snapshot.departments
          print("source_user_count=" + str(len(snapshot.users)))
          print("source_department_count=" + str(len(snapshot.departments)))
          for action, count in sorted(Counter(item["action"] for item in job.plan["operations"]).items()):
              print("planned_" + action + "=" + str(count))
          print("planned_department_count=" + str(len(job.plan["departments"])))
          assert Binding.objects.count() == bindings_before
          assert Operation.objects.count() == operations_before
          print("business_operation_rows_added=0 binding_changes=0")
          PY
  verify-pr-61:
    if: ${{ false }}
    runs-on: [self-hosted, linux, x64, production]
    environment: production
    timeout-minutes: 5
    steps:
      - name: Verify deployed PR 61 revision and read-only health
        shell: bash
        run: |
          set -Eeuo pipefail
          expected=a480636d3dc40e4a9e98ef859831320b50ed7140
          actual="$(tr -d '\r\n' < /opt/ad-org-sync/shared/last_successful_image_tag)"
          test "$actual" = "$expected"
          echo "last_successful_image_tag=$actual"
          for service in web nginx; do
            container="ad_org_sync-$service-1"
            image="$(docker inspect --format '{{.Config.Image}}' "$container")"
            state="$(docker inspect --format '{{.State.Status}}' "$container")"
            health="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
            test "$state" = running
            test "$health" = healthy
            if test "$service" = web; then test "$image" = "ad-org-sync-web:$expected"; fi
            echo "container=$container image=$image state=$state health=$health"
          done
          docker exec ad_org_sync-web-1 python -m sync_app.cli db_check
          docker exec ad_org_sync-web-1 python -m sync_app.cli shell -c 'from sync_app.models import Configuration; c=Configuration.objects.get(pk=1); assert not c.schedule_enabled and not c.sspr_enabled; print("schedule_enabled=false sspr_enabled=false")'
          for path in healthz readyz login sspr; do
            code="$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' "http://127.0.0.1/$path")"
            test "$code" = 200
            echo "localhost_$path=$code"
          done
  verify:
    if: ${{ false }}
    runs-on: [self-hosted, linux, x64, production]
    environment: production
    steps:
      - name: Inspect deployed revision, health, and scheduler
        shell: bash
        run: |
          set -Eeuo pipefail
          expected=9f04c5f991573a6496a08ec881e2ebc571cd6367
          actual="$(tr -d '\r\n' < /opt/ad-org-sync/shared/last_successful_image_tag)"
          test "$actual" = "$expected"
          echo "last_successful_image_tag=$actual"
          for service in web nginx; do
            container="ad_org_sync-$service-1"
            image="$(docker inspect --format '{{.Config.Image}}' "$container")"
            state="$(docker inspect --format '{{.State.Status}}' "$container")"
            health="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
            test "$state" = running
            test "$health" = healthy
            if test "$service" = web; then test "$image" = "ad-org-sync-web:$expected"; fi
            echo "container=$container image=$image state=$state health=$health"
          done
          test "$(stat -c '%a' /opt/ad-org-sync/shared/.env)" = 600
          test "$(stat -c '%a' /opt/ad-org-sync/shared/admin_password.txt)" = 600
          echo 'protected_file_modes=0600'
          cron="$(crontab -l)"
          count="$(printf '%s\n' "$cron" | grep -Fc '# AD_ORG_SYNC_SCHEDULER')"
          test "$count" = 1
          printf '%s\n' "$cron" | grep -Fq 'docker exec ad_org_sync-web-1 python -m sync_app.cli enqueue_sync --due'
          test "$(systemctl is-active cron)" = active
          echo 'scheduler_entry_count=1 cron_service=active'
          docker exec ad_org_sync-web-1 python -m sync_app.cli shell -c 'from sync_app.models import Configuration, Job; c=Configuration.objects.filter(pk=1).values("schedule_enabled","sspr_enabled").first(); assert c is not None; assert c["schedule_enabled"] is False; assert c["sspr_enabled"] is False; print("schedule_enabled=false sspr_enabled=false scheduler_jobs="+str(Job.objects.filter(actor="scheduler").count()))'
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1/readyz >/dev/null
          echo 'localhost_readyz=200'
          nginx_config="$(docker exec ad_org_sync-nginx-1 nginx -T 2>&1 || true)"
          grep -Fq 'set_real_ip_from 10.106.1.119;' <<< "$nginx_config"
          grep -Fq 'real_ip_header X-Forwarded-For;' <<< "$nginx_config"
          echo 'nginx_trusts_gateway=true nginx_reads_forwarded_for=true'
          echo "nginx_sets_real_ip=$(grep -Fq 'proxy_set_header X-Real-IP $remote_addr;' <<< "$nginx_config" && echo true || echo false)"
          access_logs="$(docker logs --since 20m ad_org_sync-nginx-1 2>&1)"
          normal="$(printf '%s\n' "$access_logs" | grep 'codex_ipdiag=9f04c5f-normal' | tail -n 1 || true)"
          spoof="$(printf '%s\n' "$access_logs" | grep 'codex_ipdiag=9f04c5f-spoof' | tail -n 1 || true)"
          normal_ip="$(printf '%s\n' "$normal" | awk '{print $1}')"
          spoof_ip="$(printf '%s\n' "$spoof" | awk '{print $1}')"
          echo "normal_probe_found=$(test -n "$normal_ip" && echo true || echo false)"
          echo "spoof_probe_found=$(test -n "$spoof_ip" && echo true || echo false)"
          echo "same_client_ip=$(test "$normal_ip" = "$spoof_ip" && echo true || echo false)"
          echo "normal_is_gateway=$(test "$normal_ip" = 10.106.1.119 && echo true || echo false)"
          echo "spoof_is_supplied_ip=$(test "$spoof_ip" = 203.0.113.55 && echo true || echo false)"
          test -n "$normal_ip"
          test -n "$spoof_ip"
          test "$normal_ip" = "$spoof_ip"
          test "$spoof_ip" != 203.0.113.55
          if test "$normal_ip" = 10.106.1.119; then
            echo 'per_client_ip_available=false'
          else
            echo 'per_client_ip_available=true'
          fi
          echo 'spoofed_header_ignored=true'
      - name: Resolve dedicated test employee without changing AD
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i ad_org_sync-web-1 python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "sync_app.settings")
          import django
          django.setup()
          from sync_app.directory import ActiveDirectory, DingTalk
          from sync_app.domain import RuleError, protected
          from sync_app.models import Configuration

          identifier = "T0001919"
          config = Configuration.current()
          source = DingTalk()
          try:
              try:
                  person = source.user(identifier)
                  kind = "userid"
              except RuleError:
                  users, _ = source.collect(config.root_department)
                  matches = [user for user in users if user["employee_id"] == identifier]
                  print("dingtalk_job_number_matches=" + str(len(matches)))
                  if len(matches) != 1:
                      raise SystemExit(0)
                  person = matches[0]
                  kind = "job_number"
              print("dingtalk_identifier_type=" + kind)
              print("dingtalk_userid=" + person["source_id"])
              print("dingtalk_job_number=" + person["employee_id"])
              value = person.get(config.sspr_match, "")
              print("ad_match_field=" + config.sspr_match)
              if not value:
                  print("ad_match_count=0")
                  raise SystemExit(0)
              ad = ActiveDirectory()
              try:
                  matches = ad.match(config.sspr_match, value)
                  print("ad_match_count=" + str(len(matches)))
                  if len(matches) == 1:
                      account = matches[0]
                      print("ad_username=" + account["username"])
                      print("ad_eligible=" + str(account["enabled"] and not protected(account)).lower())
              finally:
                  ad.close()
          finally:
              source.close()
          PY
  inspect-plan:
    if: ${{ false }}
    runs-on: [self-hosted, linux, x64, production]
    environment: production
    steps:
      - name: Inspect the exact target and OU changes in the existing preview
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i ad_org_sync-web-1 python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "sync_app.settings")
          import django
          django.setup()
          from sync_app.models import Binding, Job

          job = Job.objects.get(pk="9c82e776-1eb9-480f-8a9c-ee0923a20d95")
          assert job.kind == "preview" and job.status == "preview_ready"
          assert job.scope == "users" and job.selected == ["17757325700496563"]
          print("preview_status=" + job.status)
          print("preview_high_risk=" + str(job.plan["high_risk"]).lower())
          print("preview_operations=" + str(len(job.plan["operations"])))
          print("existing_binding_count=" + str(Binding.objects.filter(person__source_id="17757325700496563").count()))
          for operation in job.plan["operations"]:
              print("action=" + operation["action"])
              print("target_dn=" + operation["target"]["dn"])
              print("planned_ou=" + operation["ou"])
              for change in operation.get("changes", []):
                  print("change=" + change["field"] + "|" + str(change["before"]) + "|" + str(change["after"]))
          for department in job.plan["departments"]:
              print("department=" + department["source_id"] + "|" + department["action"] + "|" + department["dn"] + "|" + department["reason"])
          PY
      - name: Preserve the existing test OU and refresh the preview
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i ad_org_sync-web-1 python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "sync_app.settings")
          import django
          django.setup()
          from contextlib import closing
          from sync_app import synchronization
          from sync_app.directory import ActiveDirectory, under
          from sync_app.locking import lock
          from sync_app.models import Binding, Configuration, DepartmentBinding, Job
          from sync_app.security import audit

          source_id = "17757325700496563"
          department_id = "555858155"
          before_bindings = Binding.objects.count()
          original = Job.objects.get(pk="9c82e776-1eb9-480f-8a9c-ee0923a20d95")
          assert original.kind == "preview" and original.status == "preview_ready"
          assert original.scope == "users" and original.selected == [source_id]
          operation = original.plan["operations"][0]
          assert len(original.plan["operations"]) == 1 and operation["action"] == "bind"
          assert operation["target"]["username"] == "T0001919"
          assert [d["name"] for d in original.plan["departments"] if d["source_id"] == department_id] == ["天机智能"]
          existing_ou = operation["target"]["dn"]
          for _ in range(3):
              existing_ou = synchronization.parent_dn(existing_ou)
          config = Configuration.current()
          assert original.plan["config"] == synchronization.configuration_signature(config)
          assert original.plan["bindings"] == synchronization.binding_signature()
          assert under(existing_ou, config.root_ou)
          with lock("sync"), closing(ActiveDirectory()) as ad:
              assert ad.by_guid(operation["target"]["guid"])["dn"] == operation["target"]["dn"]
              guid = ad.verify_ou(existing_ou)
              mapping, created = DepartmentBinding.objects.get_or_create(
                  source_id=department_id,
                  defaults={"dn": existing_ou, "object_guid": guid, "manual": True},
              )
              assert mapping.dn == existing_ou and str(mapping.object_guid) == guid and mapping.manual
              if created:
                  audit("acceptance", "department_binding", department_id, "保留现有测试 OU")
          print("existing_ou_mapping_created=" + str(created).lower())
          latest = Job.objects.filter(actor="acceptance-preview-mapped").order_by("-created_at").first()
          if latest is None:
              latest = synchronization.enqueue(kind="preview", scope="users", selected=[source_id], actor="acceptance-preview-mapped")
              synchronization.run_next()
          latest.refresh_from_db()
          assert latest.scope == "users" and latest.selected == [source_id]
          print("mapped_preview_job_id=" + str(latest.pk))
          print("mapped_preview_status=" + latest.status)
          print("mapped_preview_operation_count=" + str(len(latest.plan.get("operations", []))))
          for item in latest.plan.get("operations", []):
              print("mapped_preview_action=" + item["action"])
              print("mapped_preview_change_fields=" + ",".join(change["field"] for change in item.get("changes", [])))
              print("mapped_preview_ou_is_current=" + str(synchronization.parent_dn(item["target"]["dn"]).casefold() == item["ou"].casefold()).lower())
          print("mapped_preview_department_conflicts=" + str(sum(item["action"] == "conflict" for item in latest.plan.get("departments", []))))
          print("mapped_preview_new_ou_count=" + str(sum(item["guid"] is None for item in latest.plan.get("departments", []))))
          assert Binding.objects.count() == before_bindings, "preview changed a binding"
          print("mapped_preview_bindings_unchanged=true")
          PY
  apply-preview:
    if: ${{ false }}
    runs-on: [self-hosted, linux, x64, production]
    environment: production
    steps:
      - name: Apply the reviewed single-person binding and verify AD identity
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i ad_org_sync-web-1 python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "sync_app.settings")
          import django
          django.setup()
          import time
          from contextlib import closing
          from sync_app import synchronization
          from sync_app.directory import ActiveDirectory
          from sync_app.domain import fingerprint
          from sync_app.models import Binding, Job, Operation

          source_id = "17757325700496563"
          job = Job.objects.get(pk="bf283e38-7fde-4b0f-ae01-9dac6559bf67")
          assert job.scope == "users" and job.selected == [source_id]
          assert not job.plan["high_risk"]
          assert len(job.plan["operations"]) == 1
          operation = job.plan["operations"][0]
          assert operation["action"] == "bind" and operation["target"]["username"] == "T0001919"
          assert not operation["changes"]
          assert synchronization.parent_dn(operation["target"]["dn"]).casefold() == operation["ou"].casefold()
          assert all(department["action"] != "conflict" and department["guid"] for department in job.plan["departments"])
          with closing(ActiveDirectory()) as ad:
              before = ad.by_guid(operation["target"]["guid"])
              assert fingerprint(before) == fingerprint(operation["target"])
