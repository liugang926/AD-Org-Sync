name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  quality:
    name: Quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install quality dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,test]"

      - name: Syntax and high-severity static analysis
        run: |
          python -m compileall -q sync_app
          python -m ruff check sync_app --select E9,F821,F841,B007,F541

      - name: Incremental type boundary
        run: |
          python -m mypy sync_app/application sync_app/core/observability.py sync_app/core/slo.py sync_app/core/runtime_state_machine.py sync_app/core/fingerprints.py sync_app/core/value_coercion.py sync_app/services/config_resolution.py

      - name: Fast architecture and contract tests
        run: |
          python -m pytest -q tests/test_fingerprints.py tests/test_observability.py tests/test_slo.py tests/test_runtime_state_machine.py tests/test_config_resolution.py tests/test_migration_integrity.py tests/test_backup_restore.py tests/test_provider_contracts.py tests/test_source_providers.py tests/test_target_providers.py tests/test_github_actions_contract.py

  windows:
    needs: quality
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m compileall -q sync_app

      - name: Static analysis
        run: |
          python -m ruff check sync_app --select E9,F821,F841,B007,F541

      - name: CLI smoke
        run: |
          python -m sync_app.cli version
          python -m sync_app.cli --help

      - name: Unit and integration tests
        run: |
          python -m pytest -q --ignore=tests/test_web_browser_regression.py

      - name: Package smoke
        run: |
          python -m PyInstaller --noconfirm --clean AD-Org-Sync.spec
          if (!(Test-Path "dist\\AD-Org-Sync.exe")) { exit 1 }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ad-org-sync-windows
          path: |
            dist/AD-Org-Sync.exe
            config.example.ini

  container:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build production container
        run: docker build --tag ad-org-sync:ci .

  package-supply-chain:
    name: Wheel / migrations / SBOM
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,test,build]"

      - name: Build wheel
        run: python -m build --wheel --outdir dist/packages

      - name: Verify clean wheel installation and package data
        run: |
          python -m venv .wheel-smoke
          WHEEL=$(ls dist/packages/*.whl)
          .wheel-smoke/bin/python -m pip install --upgrade pip
          .wheel-smoke/bin/python -m pip install "${WHEEL}[web]"
          .wheel-smoke/bin/python -m sync_app.cli version
          .wheel-smoke/bin/python -c "from importlib.resources import files; root=files('sync_app.web'); assert root.joinpath('templates/base.html').is_file(); assert root.joinpath('static/app.css').is_file()"

      - name: Verify migrations and backup recovery drill
        run: python -m pytest -q tests/test_migration_integrity.py tests/test_backup_restore.py

      - name: Generate validated CycloneDX SBOM
        run: |
          python -m cyclonedx_py environment .wheel-smoke/bin/python --pyproject pyproject.toml --output-format JSON --output-reproducible --output-file dist/packages/ad-org-sync.sbom.cdx.json --validate
          python -c "import json; payload=json.load(open('dist/packages/ad-org-sync.sbom.cdx.json', encoding='utf-8')); assert payload['bomFormat'] == 'CycloneDX'; assert payload.get('components')"

      - name: Upload wheel and SBOM
        uses: actions/upload-artifact@v7
        with:
          name: ad-org-sync-python-supply-chain
          path: |
            dist/packages/*.whl
            dist/packages/*.cdx.json

  browser-regression:
    needs: quality
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install chromium

      - name: Browser regression
        run: |
          python -m unittest tests.test_web_browser_regression -v

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-regression-artifacts
          if-no-files-found: warn
          path: |
            test_artifacts/browser/*.png

  deploy-production:
    name: Deploy / Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - windows
      - container
      - package-supply-chain
      - browser-regression
    runs-on: [self-hosted, linux, x64, production]
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Checkout verified revision
        uses: actions/checkout@v7

      - name: Deploy verified containers
        env:
          AD_ORG_SYNC_IMAGE_TAG: ${{ github.sha }}
          PRODUCTION_ENV_FILE: /opt/ad-org-sync/shared/.env
          PRODUCTION_STATE_DIR: /opt/ad-org-sync/shared
        run: bash scripts/deploy-production.sh
