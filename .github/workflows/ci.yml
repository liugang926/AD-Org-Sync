name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

env:
  PIP_NO_CACHE_DIR: "1"

jobs:
  quality:
    name: Quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - name: Django, syntax and static checks
        run: |
          python -m compileall -q sync_app
          python -m ruff check sync_app tests --select E9,F821,F841,B007,F541
          python -m mypy sync_app/domain.py
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Business and deployment contracts
        run: python -m pytest -q --ignore=tests/test_browser.py

  windows:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - name: Windows CLI and business regression
        run: |
          python -m sync_app.cli --version
          python manage.py check
          python -m pytest -q --ignore=tests/test_browser.py

  container:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production container
        run: docker build --pull --tag ad-org-sync:ci .
      - name: Check container database and packaged application
        run: |
          docker run --rm ad-org-sync:ci python -m sync_app.cli check
          docker run --rm ad-org-sync:ci sh -ec 'python -m sync_app.cli migrate --noinput && python -m sync_app.cli db_check'

  package-supply-chain:
    name: Wheel / migrations / SBOM
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: python -m build --wheel --outdir dist/packages
      - name: Verify isolated wheel installation
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/pip install dist/packages/*.whl
          PYTHON="$PWD/.wheel-smoke/bin/python"
          cd "$(mktemp -d)"
          "$PYTHON" -m sync_app.cli check
          "$PYTHON" -m sync_app.cli migrate --noinput
          "$PYTHON" -m sync_app.cli db_check
          "$PYTHON" -c "from importlib.resources import files; p=files('sync_app'); assert p.joinpath('templates/sspr.html').is_file(); assert p.joinpath('static/app.css').is_file()"
      - name: Backup and migration recovery tests
        run: python -m pytest -q tests/test_operations.py
      - name: Validated CycloneDX SBOM
        run: python -m cyclonedx_py environment .wheel-smoke/bin/python --pyproject pyproject.toml --output-format JSON --output-reproducible --output-file dist/packages/ad-org-sync.sbom.cdx.json --validate
      - uses: actions/upload-artifact@v7
        with:
          name: ad-org-sync-python-supply-chain
          path: |
            dist/packages/*.whl
            dist/packages/*.cdx.json

  browser-regression:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: python -m playwright install chromium
      - name: Administrator and employee browser regression
        run: python -m pytest -q tests/test_browser.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-regression-artifacts
          if-no-files-found: warn
          path: test_artifacts/browser/*.png

  deploy-production:
    name: Deploy / Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, container, package-supply-chain, browser-regression]
    runs-on: [self-hosted, linux, x64, production]
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@v7
      - name: Deploy verified containers
        env:
          AD_ORG_SYNC_IMAGE_TAG: ${{ github.sha }}
          PRODUCTION_ENV_FILE: /opt/ad-org-sync/shared/.env
          PRODUCTION_STATE_DIR: /opt/ad-org-sync/shared
        run: bash scripts/deploy-production.sh
