name: ${COMPOSE_PROJECT_NAME:-ad_org_sync}
x-app: &app
  image: ad-org-sync-web:${AD_ORG_SYNC_IMAGE_TAG:-local}
  build: .
  environment: &environment
    AD_ORG_SYNC_DATA_DIR: /data
    AD_ORG_SYNC_IMAGE_TAG: ${AD_ORG_SYNC_IMAGE_TAG:-local}
    AD_ORG_SYNC_PUBLIC_BASE_URL: ${AD_ORG_SYNC_PUBLIC_BASE_URL:?Set external HTTPS URL}
    AD_ORG_SYNC_ADMIN_USERNAME: ${AD_ORG_SYNC_ADMIN_USERNAME:-admin}
    AD_ORG_SYNC_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    DINGTALK_CORP_ID: ${DINGTALK_CORP_ID:-}
    DINGTALK_APP_KEY: ${DINGTALK_APP_KEY:-}
    DINGTALK_APP_SECRET: ${DINGTALK_APP_SECRET:-}
    SSPR_ALLOWED_DINGTALK_USER_IDS: ${SSPR_ALLOWED_DINGTALK_USER_IDS:-}
    LDAP_HOST: ${LDAP_HOST:-}
    LDAP_BASE_DN: ${LDAP_BASE_DN:-}
    LDAP_BIND_DN: ${LDAP_BIND_DN:-}
    LDAP_PASSWORD: ${LDAP_PASSWORD:-}
    LDAP_VERIFY_CERT: ${LDAP_VERIFY_CERT:-false}
  volumes:
    - ad_org_sync_data:/data
    - ad_org_sync_logs:/app/logs
    - ad_org_sync_secrets:/run/secrets:ro
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  volume-permissions:
    image: ad-org-sync-web:${AD_ORG_SYNC_IMAGE_TAG:-local}
    build: .
    user: root
    volumes:
      - ad_org_sync_data:/data
      - ad_org_sync_logs:/app/logs
      - ad_org_sync_secrets:/run/secrets
      - type: bind
        source: ${AD_ORG_SYNC_ADMIN_PASSWORD_FILE:?Set protected host password file}
        target: /source/admin_password
        read_only: true
      - type: bind
        source: ${LDAP_CA_HOST_FILE:-/dev/null}
        target: /source/ad-ca.pem
        read_only: true
    command: ["sh", "-ec", "chown -R 10001:10001 /data /app/logs /run/secrets; install -m 0400 -o 10001 -g 10001 /source/admin_password /run/secrets/admin_password; if [ -s /source/ad-ca.pem ]; then install -m 0444 -o 10001 -g 10001 /source/ad-ca.pem /run/secrets/ad-ca.pem; else rm -f /run/secrets/ad-ca.pem; fi"]
  web:
    <<: *app
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
    expose: ["8010"]
    command: ["sh", "-ec", "python -m sync_app.cli migrate --noinput && python -m sync_app.cli bootstrap && python -m sync_app.cli collectstatic --noinput && exec python -m sync_app.cli serve --host 0.0.0.0"]
  worker:
    <<: *app
    depends_on:
      web:
        condition: service_healthy
    command: ["python", "-m", "sync_app.cli", "worker"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; assert time.time()-os.stat('/data/worker-heartbeat').st_mtime < 90"]
      interval: 15s
      timeout: 5s
      retries: 3
  nginx:
    image: nginx:stable-alpine
    depends_on:
      web:
        condition: service_healthy
    ports: ["${AD_ORG_SYNC_HTTP_BIND:-127.0.0.1}:${AD_ORG_SYNC_HTTP_PORT:-80}:80"]
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN, NET_BIND_SERVICE, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  ad_org_sync_data:
  ad_org_sync_logs:
  ad_org_sync_secrets:
