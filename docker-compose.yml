x-app-image: &app-image
  image: ad-org-sync-web:${AD_ORG_SYNC_IMAGE_TAG:-local}
  build:
    context: .

name: ${COMPOSE_PROJECT_NAME:-ad_org_sync}

services:
  volume-permissions:
    <<: *app-image
    user: root
    volumes:
      - ad_org_sync_data:/data
      - ad_org_sync_logs:/app/logs
      - ad_org_sync_secrets:/run/secrets
      - type: bind
        source: ${AD_ORG_SYNC_ADMIN_PASSWORD_FILE:?Set AD_ORG_SYNC_ADMIN_PASSWORD_FILE to a protected password file}
        target: /source/admin_password
        read_only: true
    command:
      - sh
      - -ec
      - |
        chown -R 10001:10001 /data /app/logs /run/secrets
        install -m 0400 -o 10001 -g 10001 /source/admin_password /run/secrets/admin_password

  web:
    <<: *app-image
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
    working_dir: /app
    environment:
      AD_ORG_SYNC_DB_PATH: /data/app.db
      AD_ORG_SYNC_ADMIN_USERNAME: ${AD_ORG_SYNC_ADMIN_USERNAME:-admin}
      AD_ORG_SYNC_PUBLIC_BASE_URL: ${AD_ORG_SYNC_PUBLIC_BASE_URL:?Set AD_ORG_SYNC_PUBLIC_BASE_URL to the external HTTPS URL}
      AD_ORG_SYNC_SECURE_COOKIES: ${AD_ORG_SYNC_SECURE_COOKIES:-always}
      AD_ORG_SYNC_ENVIRONMENT_LABEL: ${AD_ORG_SYNC_ENVIRONMENT_LABEL:-}
    volumes:
      - ad_org_sync_data:/data
      - ad_org_sync_logs:/app/logs
      - ad_org_sync_secrets:/run/secrets:ro
    expose:
      - "8010"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - |
        python -m sync_app.cli init-web --db-path "$${AD_ORG_SYNC_DB_PATH}" --config /app/config.example.ini
        python -m sync_app.cli bootstrap-admin --db-path "$${AD_ORG_SYNC_DB_PATH}" --username "$${AD_ORG_SYNC_ADMIN_USERNAME}" --password-file /run/secrets/admin_password --if-missing
        exec python -m sync_app.cli web --db-path "$${AD_ORG_SYNC_DB_PATH}" --config /app/config.example.ini --host 0.0.0.0 --port 8010 --public-base-url "$${AD_ORG_SYNC_PUBLIC_BASE_URL}" --secure-cookies "$${AD_ORG_SYNC_SECURE_COOKIES}"

  nginx:
    image: nginx:stable-alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${AD_ORG_SYNC_HTTP_BIND:-0.0.0.0}:${AD_ORG_SYNC_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ad_org_sync_data:
  ad_org_sync_logs:
  ad_org_sync_secrets:
