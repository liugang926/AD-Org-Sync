{% if policy %}
<section class="sspr-password-policy" aria-labelledby="password-policy-heading">
  <h2 id="password-policy-heading">当前生效的 AD 密码策略</h2>
  {% if policy.lookup_failed %}
  <p role="status">暂时无法读取 AD 密码策略，请重试或联系管理员。密码修改仍会由域控按实际策略校验。</p>
  {% else %}
  <ul>
    {% for requirement in policy.requirement_lines %}
    <li>{{ requirement }}</li>
    {% endfor %}
  </ul>
  <p class="muted">策略来源：{{ policy.source_label }}。域控最终校验仍是权威结果；自定义密码过滤器可能附加要求。</p>
  {% endif %}
</section>
{% endif %}
